[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading212-mcp"
version = "0.1.0"
description = "MCP server exposing the Trading 212 public API as tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vichu" }]
keywords = ["mcp", "trading212", "llm", "tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
trading212-mcp = "trading212_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trading212_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
